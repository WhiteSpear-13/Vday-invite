<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>It’s a Date 💖</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(to bottom right, #ff758c, #ff7eb3);
        color: white;
        margin: 0;
        padding: 20px;
        text-align: center;
    }

    .section {
        background: rgba(0,0,0,0.25);
        padding: 25px;
        border-radius: 20px;
        margin-bottom: 25px;
    }

    .gallery {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px; /* space between images */
    }

    .gallery img {
        max-width: 240px; /* max size */
        width: auto;       /* keep original aspect ratio */
        height: auto;      /* keep original aspect ratio */
        border-radius: 15px;
    }

    /* Mobile-friendly tweaks */
    @media (max-width: 500px) {
        .gallery img {
            max-width: 180px;
        }
    }
</style>
</head>

<body>

<!-- Background Music -->
<audio autoplay loop>
    <source src="music/valentines.mp3" type="audio/mpeg">
</audio>

<div class="section">
    <h1>Yay!!! 💖</h1>
    <p>I can’t wait to spend Valentine’s Day with you 🥰</p>
</div>

<div class="section">
    <h2>Us ❤️</h2>
    <div class="gallery">
        <img src="images/pic1.jpg">
        <img src="images/pic2.jpg">
        <img src="images/pic3.jpg">
    </div>
</div>

<div class="section">
    <h2>Our Date Plan 💌</h2>
    <p><strong>📅 Date:</strong> February 14</p>
    <p><strong>⏰ Time:</strong> 6:30 PM</p>
    <p><strong>📍 Place:</strong> (Don’t worry… it’s a surprise 😉)</p>
    <p><strong>✨ Plan:</strong> Dinner, laughs, and just us.</p>
</div>

</body>
</html>
